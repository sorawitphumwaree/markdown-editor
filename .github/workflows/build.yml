name: build

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/MarkdownEditor.Web/pnpm-lock.yaml
      - run: pnpm --dir src/MarkdownEditor.Web install --frozen-lockfile
      - run: pnpm --dir src/MarkdownEditor.Web typecheck
      - run: pnpm --dir src/MarkdownEditor.Web test
      - run: pnpm --dir src/MarkdownEditor.Web test:browser
      - run: dotnet test MarkdownEditor.sln --configuration Release
