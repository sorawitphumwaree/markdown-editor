name: release

on:
  workflow_dispatch:

jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm --dir src/MarkdownEditor.Web install --frozen-lockfile
      - run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: markdown-editor-win-x64
          path: artifacts/markdown-editor-win-x64.zip
